plugins {
    id 'java'
    // Рекомендуется добавить плагин для Lombok (упрощает настройку)
    // id 'io.freefair.lombok' version '8.6'  // раскомментируйте, если хотите использовать плагин
}

group = 'com.spring'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

compileJava {
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // JME
    implementation "org.jmonkeyengine:jme3-core:3.9.0-stable"
    implementation "org.jmonkeyengine:jme3-desktop:3.9.0-stable"
    implementation "org.jmonkeyengine:jme3-lwjgl3:3.9.0-stable"
    implementation "org.jmonkeyengine:jme3-effects:3.9.0-stable"
    implementation "org.jmonkeyengine:jme3-plugins:3.9.0-stable"
    implementation "org.jmonkeyengine:jme3-jbullet:3.9.0-stable"
    implementation "org.jmonkeyengine:jme3-jogg:3.9.0-stable"
    implementation "org.jmonkeyengine:jme3-niftygui:3.9.0-stable"
}

test {
    useJUnitPlatform()
}

tasks.register('apiJar', Jar) {
    archiveFileName.set('module-api.jar')
    from(sourceSets.main.output) {
        include 'com/mygame/plugins/api/**'
    }
}

tasks.named('build') {
    finalizedBy('apiJar')
}